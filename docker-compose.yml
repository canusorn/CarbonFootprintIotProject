services:
  # ---------------------------------------------------------------------------
  # Nginx Proxy Manager — reverse proxy with web UI (https://nginxproxymanager.com)
  # Admin UI: http://<server-ip>:81  (default: admin@example.com / changeme)
  # ---------------------------------------------------------------------------
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"    # public HTTP
      - "443:443"  # public HTTPS
      - "81:81"    # admin UI
    volumes:
      # external config/certs so they survive container replacement
      - ./docker/npm/data:/data
      - ./docker/npm/letsencrypt:/etc/letsencrypt

  # ---------------------------------------------------------------------------
  # MySQL 8.4 (official image)
  # The API creates `carbon_footprint_db` and `sensor` automatically on start.
  # Data lives in a named volume. On a Linux host you can bind-mount a path
  # instead (bind-mounting a MySQL datadir from Windows/NTFS is unreliable):
  #   - ./docker/mysql/data:/var/lib/mysql
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.4
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ}
    command:
      - --default-time-zone=+07:00
    volumes:
      - db_data:/var/lib/mysql
    # Uncomment to allow external SQL clients (DBeaver/HeidiSQL) from your LAN:
    # ports:
    #   - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Backend API + MQTT broker (official node image, code bind-mounted from ./node)
  # - 3000 REST API (Express)          -> optional via NPM (proxy to api:3000)
  # - 1883 MQTT over TCP (ESP32)        -> MUST be exposed directly:
  #     NPM (free) only proxies HTTP/WebSocket, not raw TCP (that is the
  #     paid "Streams" feature), so ESP32s connect to <server-ip>:1883.
  # - 8083 MQTT over WebSocket          -> optional via NPM (proxy to api:8083
  #     with "Websockets Support" ON); only needed directly for LAN mode.
  # ---------------------------------------------------------------------------
  api:
    image: node:22-alpine
    container_name: api
    restart: unless-stopped
    working_dir: /app
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_TIMEZONE: ${DB_TIMEZONE}
      PORT: ${PORT}
      MQTT_PORT: ${MQTT_PORT}
      WS_PORT: ${WS_PORT}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TZ: ${TZ}
    volumes:
      # external path to code — edit on host, restart container to apply
      - ./node:/app
      # anonymous volume so the container's Linux node_modules don't collide
      # with the host's Windows node_modules inside the bind mount
      - api_node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && node server.js"
    ports:
      - "1883:1883" # ESP32 raw MQTT — cannot go through NPM
      # Direct access mode (no domains). If the frontend is built with
      # VITE_SERVERURL=http://<ip>:3000 and no VITE_MQTTURL, uncomment:
      # - "3000:3000"
      # - "8083:8083"
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend builder — one-shot container that runs `npm install && npm run
  # build` so the host doesn't need Node.js installed. Output lands in the
  # bind mount (./vue/dist) and `web` serves it immediately (nginx reads the
  # files per request; no restart needed after a rebuild).
  # Re-run after code changes:   docker compose run --rm web-builder
  # ---------------------------------------------------------------------------
  web-builder:
    image: node:22-alpine
    container_name: web-builder
    restart: "no"
    working_dir: /app
    volumes:
      - ./vue:/app
      # named volume, same trick as `api`: keeps the container's Linux
      # node_modules out of the host bind mount
      - web_node_modules:/app/node_modules
    # Pass Vite build-time vars here if the frontend starts using them, e.g.
    #   environment:
    #     VITE_SERVERURL: ${VITE_SERVERURL}
    command: sh -c "npm install --no-audit --no-fund && npm run build"

  # ---------------------------------------------------------------------------
  # Frontend — static files built by the `web-builder` service (or manually
  # with `cd vue && npm run build`), served by official nginx with SPA
  # history-mode fallback.
  # ---------------------------------------------------------------------------
  web:
    image: nginx:1.27-alpine
    container_name: web
    restart: unless-stopped
    volumes:
      # external path to the build output
      - ./vue/dist:/usr/share/nginx/html:ro
      - ./docker/nginx/web.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80" # direct access (NPM can also proxy to `web:80` without this)
    depends_on:
      web-builder:
        condition: service_completed_successfully

# NPM proxy hosts to create in the UI (http://<server-ip>:81):
#   app.yourdomain.com  -> web  : 80   (+ Let's Encrypt)
#   api.yourdomain.com  -> api  : 3000 (+ Let's Encrypt)
#   mqtt.yourdomain.com -> api  : 8083 (+ Let's Encrypt, Websockets Support ON)
#   (or add a custom location /mqtt on the api host -> api:8083)

volumes:
  db_data:
  api_node_modules:
  web_node_modules:
