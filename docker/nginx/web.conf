server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router uses history mode — let unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hashed assets can be cached aggressively
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
